name: Multi-Platform Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (all, linux, windows, android)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - windows
          - android

env:
  # ─────────────────────────────────────────────────────────────
  # Project-specific configuration
  # ─────────────────────────────────────────────────────────────
  PROJECT_NAME: AeroPhotoRoutes
  PROJECT_VERSION: 1.0.0
  
  # Platform identifiers (must match CMake toolchains)
  ANDROID_PLATFORM: android-arm64-v8a

  # Include directory structure
  INCLUDE_DIR: include/aerophoto_routes

  # Documentation directory
  DOC_DIR: share/doc/AeroPhotoRoutes

  # Build configuration
  BUILD_TYPE: Release

  # Dependencies
  GTEST_VERSION: v1.15.2
  NDK_VERSION: r29

  # ccache configuration
  CCACHE_VERSION: "4.10"

  # Android configuration
  ANDROID_ABI: arm64-v8a # still should be hardcoded in matrix abi section

jobs:
  # ─────────────────────────────────────────────────────────────
  # LINUX BUILD
  # ─────────────────────────────────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux') || github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        arch: [x86_64]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtest-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libzstd-dev \
            libzip4t64 \
            zlib1g-dev \
            libzip-dev \
            zipcmp \
            zipmerge \
            ziptool

      - name: Download ccache
        id: ccache
        shell: cmake -P {0}
        run: |
          set(ccache_version "$ENV{CCACHE_VERSION}")
          set(ccache_dir "ccache-${ccache_version}-linux-x86_64")
          set(ccache_archive "${ccache_dir}.tar.xz")

          set(ccache_url "https://github.com/ccache/ccache/releases/download/v${ccache_version}/${ccache_archive}")
          file(DOWNLOAD "${ccache_url}" ./${ccache_archive} SHOW_PROGRESS)
          execute_process(COMMAND ${CMAKE_COMMAND} -E tar xvf ./${ccache_archive})

          file(TO_CMAKE_PATH "$ENV{GITHUB_WORKSPACE}/${ccache_dir}" ccache_dir)
          file(APPEND "$ENV{GITHUB_PATH}" "$ENV{GITHUB_WORKSPACE}:${ccache_dir}")
          execute_process(COMMAND chmod +x ${ccache_dir}/ccache)

      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        run: echo "timestamp=$(date -u '+%Y-%m-%d-%H;%M;%S')" >> $GITHUB_OUTPUT

      - name: ccache cache files
        uses: actions/cache@v4
        with:
          path: .ccache
          key: linux-${{ matrix.compiler }}-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: |
            linux-${{ matrix.compiler }}-ccache-

      - name: Build GoogleTest
        run: |
          cd /usr/src/googletest/
          sudo cmake -S . -B build
          sudo cmake --build build
          sudo cmake --install build
      
      - name: Install Valgrind
        run: |
          sudo apt install valgrind
          echo "Valgrind installed"
      
      - name: Configure CMake
        run: |
          ccache_basedir=${{ github.workspace }}
          export CCACHE_BASEDIR=${ccache_basedir}
          export CCACHE_DIR=${ccache_basedir}/.ccache
          export CCACHE_COMPRESS=true
          export CCACHE_COMPRESSLEVEL=6
          export CCACHE_MAXSIZE=400M
          cmake -S . -B build_linux \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/toolchains/linux-${{ matrix.compiler }}-${{ matrix.arch }}.cmake \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          ccache_basedir=${{ github.workspace }}
          export CCACHE_BASEDIR=${ccache_basedir}
          export CCACHE_DIR=${ccache_basedir}/.ccache
          export CCACHE_COMPRESS=true
          export CCACHE_COMPRESSLEVEL=6
          export CCACHE_MAXSIZE=400M
          ccache -p
          ccache -z
          cmake --build build_linux --parallel $(nproc)
          cmake --build build_linux --target testprograms

      - name: ccache statistics
        run: |
          ccache_basedir=${{ github.workspace }}
          export CCACHE_BASEDIR=${ccache_basedir}
          export CCACHE_DIR=${ccache_basedir}/.ccache
          ccache -s

      - name: Show project structure
        run: |
          echo "=== Project Structure ==="
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "CMakeLists.txt" -o -name "*.cmake" \) | grep -v "/build/" | grep -v "_deps" | sort

      - name: Test
        run: ctest -T memcheck --test-dir build_linux --output-on-failure

      - name: Install
        run: cmake --install build_linux

      - name: Show install structure
        run: |
          echo "=== Install Structure ==="
          find install -type f | head -30

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: install-linux-${{ matrix.compiler }}-${{ matrix.arch }}
          path: install
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # WINDOWS BUILD
  # ─────────────────────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows') || github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang]
        arch: [x86_64]

    steps:
      - uses: actions/checkout@v4

      - name: Download ccache
        id: ccache
        shell: cmake -P {0}
        run: |
          set(ccache_version "$ENV{CCACHE_VERSION}")
          set(ccache_dir "ccache-${ccache_version}-windows-x86_64")
          set(ccache_archive "${ccache_dir}.zip")

          set(ccache_url "https://github.com/ccache/ccache/releases/download/v${ccache_version}/${ccache_archive}")
          file(DOWNLOAD "${ccache_url}" ./${ccache_archive} SHOW_PROGRESS)
          execute_process(COMMAND ${CMAKE_COMMAND} -E tar xvf ./${ccache_archive})

          file(TO_CMAKE_PATH "$ENV{GITHUB_WORKSPACE}/${ccache_dir}" ccache_dir)
          file(APPEND "$ENV{GITHUB_PATH}" "$ENV{GITHUB_WORKSPACE};${ccache_dir}")

      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        shell: cmake -P {0}
        run: |
          string(TIMESTAMP current_date "%Y-%m-%d-%H;%M;%S" UTC)
          file(APPEND "$ENV{GITHUB_OUTPUT}" "timestamp=${current_date}")

      - name: ccache cache files
        uses: actions/cache@v4
        with:
          path: .ccache
          key: windows-${{ matrix.compiler }}-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: |
            windows-${{ matrix.compiler }}-ccache-

      - name: Install GoogleTest
        run: |
          git clone --depth 1 --branch ${{ env.GTEST_VERSION }} https://github.com/google/googletest.git C:/googletest
          cmake -S C:/googletest -B C:/googletest/build -DCMAKE_INSTALL_PREFIX=C:/googletest/install -DBUILD_GMOCK=OFF -DBUILD_SHARED_LIBS=ON
          cmake --build C:/googletest/build --config Release --target install

      - name: Configure CMake
        run: |
          $ccache_basedir = "${{ github.workspace }}"
          $env:CCACHE_BASEDIR = $ccache_basedir
          $env:CCACHE_DIR = "$ccache_basedir\.ccache"
          $env:CCACHE_COMPRESS = "true"
          $env:CCACHE_COMPRESSLEVEL = "6"
          $env:CCACHE_MAXSIZE = "400M"
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/toolchains/windows-${{ matrix.compiler }}-${{ matrix.arch }}.cmake `
            -DCMAKE_PREFIX_PATH=C:/googletest/install `
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          $ccache_basedir = "${{ github.workspace }}"
          $env:CCACHE_BASEDIR = $ccache_basedir
          $env:CCACHE_DIR = "$ccache_basedir\.ccache"
          $env:CCACHE_COMPRESS = "true"
          $env:CCACHE_COMPRESSLEVEL = "6"
          $env:CCACHE_MAXSIZE = "400M"
          ccache -p
          ccache -z
          cmake --build build --parallel --config ${{ env.BUILD_TYPE }}
          cmake --build build --target testprograms --config ${{ env.BUILD_TYPE }}

      - name: ccache statistics
        run: |
          $ccache_basedir = "${{ github.workspace }}"
          $env:CCACHE_BASEDIR = $ccache_basedir
          $env:CCACHE_DIR = "$ccache_basedir\.ccache"
          ccache -s

      # - name: Test
      #   run: |
      #     $env:PATH = "${{ github.workspace }}/third_party/GEOS/lib/${{ env.WINDOWS_PLATFORM }};C:/googletest/install/bin;$env:PATH"
      #     ctest --test-dir build --output-on-failure -C ${{ env.BUILD_TYPE }}

      - name: Install
        run: cmake --install build --config ${{ env.BUILD_TYPE }}

      - name: Show install structure
        run: |
          echo "=== Install Structure ==="
          Get-ChildItem -Recurse -File install | Select-Object -First 30 FullName

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: install-windows-${{ matrix.compiler }}-${{ matrix.arch }}
          path: install
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # ANDROID BUILD
  # ─────────────────────────────────────────────────────────────
  android:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android') || github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libzstd-dev \
            libzip4t64 \
            zlib1g-dev \
            libzip-dev \
            zipcmp \
            zipmerge \
            ziptool

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup-ndk.outputs.ndk-path }}
          key: ${{ runner.os }}-ndk-${{ env.NDK_VERSION }}
          restore-keys: |
            ${{ runner.os }}-ndk-${{ env.NDK_VERSION }}

      - name: Download ccache
        id: ccache
        shell: cmake -P {0}
        run: |
          set(ccache_version "$ENV{CCACHE_VERSION}")
          set(ccache_dir "ccache-${ccache_version}-linux-x86_64")
          set(ccache_archive "${ccache_dir}.tar.xz")

          set(ccache_url "https://github.com/ccache/ccache/releases/download/v${ccache_version}/${ccache_archive}")
          file(DOWNLOAD "${ccache_url}" ./${ccache_archive} SHOW_PROGRESS)
          execute_process(COMMAND ${CMAKE_COMMAND} -E tar xvf ./${ccache_archive})

          file(TO_CMAKE_PATH "$ENV{GITHUB_WORKSPACE}/${ccache_dir}" ccache_dir)
          file(APPEND "$ENV{GITHUB_PATH}" "$ENV{GITHUB_WORKSPACE}:${ccache_dir}")
          execute_process(COMMAND chmod +x ${ccache_dir}/ccache)

      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        run: echo "timestamp=$(date -u '+%Y-%m-%d-%H;%M;%S')" >> $GITHUB_OUTPUT

      - name: ccache cache files
        uses: actions/cache@v4
        with:
          path: .ccache
          key: android-${{ matrix.abi }}-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: |
            android-${{ matrix.abi }}-ccache-

      - name: Configure CMake
        run: |
          ccache_basedir=$(pwd)
          cmake -S . -B build_android \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/toolchains/android-${{ matrix.abi }}.cmake \
            -DANDROID_NDK=${{ steps.setup-ndk.outputs.ndk-path }} \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          ccache_basedir=$(pwd)
          export CCACHE_BASEDIR=${ccache_basedir}
          export CCACHE_DIR=${ccache_basedir}/.ccache
          export CCACHE_COMPRESS=true
          export CCACHE_COMPRESSLEVEL=6
          export CCACHE_MAXSIZE=400M
          ccache -p
          ccache -z
          cmake --build build_android --parallel $(nproc)

      - name: ccache statistics
        run: |
          ccache_basedir=$(pwd)
          export CCACHE_BASEDIR=${ccache_basedir}
          export CCACHE_DIR=${ccache_basedir}/.ccache
          ccache -s

      - name: Install
        run: cmake --install build_android

      - name: Show install structure
        run: |
          echo "=== Install Structure ==="
          find install -type f | head -30

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: install-android-${{ matrix.abi }}
          path: install
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # COMBINE ALL ARTIFACTS
  # ─────────────────────────────────────────────────────────────
  release:
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) || 
        (github.event_name == 'workflow_dispatch' && github.event.inputs.platform == 'all')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: install-*
          path: artifacts/
          merge-multiple: false

      - name: Show downloaded artifacts
        run: |
          echo "=== Downloaded Artifacts ==="
          ls -la artifacts/

      - name: Combine platforms into single distribution
        run: |
          echo "=== Combining platform artifacts ==="
          echo "Project: ${{ env.PROJECT_NAME }}"
          echo "Version: ${{ env.PROJECT_VERSION }}"

          # Create target directory structure
          mkdir -p ${{ env.PROJECT_NAME }}/lib/linux-gcc-x86_64
          mkdir -p ${{ env.PROJECT_NAME }}/lib/linux-clang-x86_64
          mkdir -p ${{ env.PROJECT_NAME }}/lib/windows-clang-x86_64
          mkdir -p ${{ env.PROJECT_NAME }}/lib/${{ env.ANDROID_PLATFORM }}
          mkdir -p ${{ env.PROJECT_NAME }}/cmake
          mkdir -p ${{ env.PROJECT_NAME }}/${{ env.INCLUDE_DIR }}
          mkdir -p ${{ env.PROJECT_NAME }}/${{ env.DOC_DIR }}

          ##### Copy common parts #####
          # Copy platform-agnostic config to root cmake/
          echo "=== Copying platform-agnostic config ==="
          cp artifacts/install-linux-gcc-x86_64/cmake/${{ env.PROJECT_NAME }}Config.cmake \
             ${{ env.PROJECT_NAME }}/cmake/
          cp artifacts/install-linux-gcc-x86_64/cmake/${{ env.PROJECT_NAME }}ConfigVersion.cmake \
             ${{ env.PROJECT_NAME }}/cmake/

          # Copy include
          echo "=== Copying headers ==="
          cp -r artifacts/install-linux-gcc-x86_64/include/* \
             ${{ env.PROJECT_NAME }}/include/

          # Copy documentation
          echo "=== Copying docs ==="
          cp -r artifacts/install-linux-gcc-x86_64/share/doc/* \
             ${{ env.PROJECT_NAME }}/${{ env.DOC_DIR }}

          # Copy each platform's libraries WITH their cmake configs
          # Each platform has its own complete cmake config with correct IMPORTED_LOCATION/IMPORTED_IMPLIB
          echo "=== Copying linux-gcc-x86_64 ==="
          cp -r artifacts/install-linux-gcc-x86_64/lib/linux-gcc-x86_64/* \
             ${{ env.PROJECT_NAME }}/lib/linux-gcc-x86_64/

          echo "=== Copying linux-clang ==="
          cp -r artifacts/install-linux-clang-x86_64/lib/linux-clang-x86_64/* \
             ${{ env.PROJECT_NAME }}/lib/linux-clang-x86_64/

          echo "=== Copying windows-clang ==="
          cp -r artifacts/install-windows-clang-x86_64/lib/windows-clang-x86_64/* \
             ${{ env.PROJECT_NAME }}/lib/windows-clang-x86_64/

          echo "=== Copying android-arm64-v8a ==="
          cp -r artifacts/install-android-arm64-v8a/lib/${{ env.ANDROID_PLATFORM }}/* \
             ${{ env.PROJECT_NAME }}/lib/${{ env.ANDROID_PLATFORM }}/

          echo "=== Final Structure ==="
          find ${{ env.PROJECT_NAME }} -type f | sort

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}
          path: ${{ env.PROJECT_NAME }}/
          retention-days: 30

      - name: Create release archive
        run: zip -r ${{ env.PROJECT_NAME }}_${{ github.sha }}.zip ${{ env.PROJECT_NAME }}/

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          files: ${{ env.PROJECT_NAME }}_${{ github.sha }}.zip
          tag_name: v${{ github.run_number }}
          name: Release ${{ github.run_number }}
          draft: false
          prerelease: ${{ github.ref != 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write