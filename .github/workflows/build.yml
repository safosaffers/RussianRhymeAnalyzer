name: Build Rhymer

# Нативная сборка приложения (оба детектора рифмы + генерация) под
# Linux и Windows. PyInstaller собирает под ту ОС, где запущен, поэтому Windows
# собирается на windows-runner, а Linux — на ubuntu-runner (кросс-компиляции нет).
# Запуск вручную: вкладка Actions -> Build Rhymer -> Run workflow.
# На теге vX.Y.Z артефакты прикрепляются к GitHub Release.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements-build.txt

      - name: Install RPST (детектор ударений, размера, схемы)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          git lfs install
          git clone --depth 1 https://github.com/RussianNLP/RussianPoetryScansionTool.git third_party/RussianPoetryScansionTool
          git -C third_party/RussianPoetryScansionTool lfs pull
          pip install -e third_party/RussianPoetryScansionTool

      - name: Build (PyInstaller)
        run: pyinstaller --noconfirm rhymer.spec

      - name: Smoke test (Linux, offscreen)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3
          QT_QPA_PLATFORM=offscreen ./dist/Rhymer/Rhymer &
          sleep 8 && kill %1 || true

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Rhymer\Rhymer.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "Rhymer.exe завершился рано (код $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "Windows smoke OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rhymer-${{ matrix.name }}
          path: dist/Rhymer
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Rhymer-*
          path: artifacts

      - name: Zip per platform
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            (cd "$d" && zip -r "../${name}.zip" .)
          done
          ls -la

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          name: Rhymer ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
