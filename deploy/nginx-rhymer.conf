# Rhymer - статический лендинг + раздача сборок.
# Путь на VPS: site/ -> /var/www/rhymer  (см. deploy/README.md).

server {
    listen 80;
    listen [::]:80;
    server_name _;   # ловит любой хост/IP; заменить на домен, когда появится

    root /var/www/rhymer;
    index index.html;

    # текст/HTML/CSS/JS - сжимаем
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # архивы сборок: отдаём как вложение, без сжатия (zip уже сжат)
    location /downloads/ {
        gzip off;
        add_header Content-Disposition "attachment";
        # большие файлы - без буферизации в память
        types { }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    # долгий кэш для статичных ассетов
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}

# HTTPS ставится через certbot (см. README) - он допишет server-блок на 443.
